<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mazing Contest browser smoke test</title>
  </head>
  <body data-status="pending">
    <pre id="result">Running…</pre>
    <script type="module">
      import {
        CELL_TYPES,
        MIN_PORTAL_SEPARATION,
        MAP_SHAPES,
        buildRivalMaze,
        calculateRouteMetrics,
        calculateRunnerSimulation,
        createCellGrid,
        createGameState,
        evaluateObstacleGroupPlacement,
        findShortestPath,
        generateBaseMap,
        generateRoundResources,
        getRunnerPositionAtTime,
        tryPlaceObstacleGroup,
        tryRemoveGeneratedObject,
        tryRemoveObstacleGroup,
      } from "../src/game-engine.js";
      import {
        addRoundScores,
        createCumulativeScores,
        normalizeRoundCount,
        rankCumulativeScores,
      } from "../src/contest-scoring.js";
      import { resolveSpectatedContestant } from "../src/spectator.js";
      import {
        createChallengeUrl,
        deriveContestRoundSeed,
        normalizeChallengeSeed,
        parseChallengeTarget,
      } from "../src/challenge.js";
      import {
        AUGMENTS,
        AUGMENT_IDS,
        AUGMENT_TIERS,
        RUN_FLOORS,
        applyMapAugments,
        applyResourceAugments,
        augmentTierForDraft,
        discountedBuildingCost,
        draftAugmentChoices,
        floorConfig,
        hasAugmentDraftAfterFloor,
        mapGenerationBonuses,
      } from "../src/roguelike.js";
      import { fitBoardGeometry } from "../src/canvas-geometry.js";
      import {
        DEFAULT_LOBBY_SERVER_URL,
        createOnlineInviteUrl,
        normalizeLobbyCode,
        normalizeLobbyServerUrl,
      } from "../src/online-lobby.js";
      import {
        LEADERBOARD_MODES,
        leaderboardApiUrl,
      } from "../src/leaderboard.js";

      const result = document.querySelector("#result");
      const checks = [];
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
        checks.push(message);
      };
      const approximately = (first, second, epsilon = 1e-7) =>
        Math.abs(first - second) <= epsilon;

      try {
        assert(
          DEFAULT_LOBBY_SERVER_URL ===
              "https://mazing-contest-lobbies.mazingcontest.workers.dev" &&
            normalizeLobbyCode("abc234") === "ABC234" &&
            normalizeLobbyServerUrl("https://rooms.example.workers.dev/") ===
              "https://rooms.example.workers.dev" &&
            createOnlineInviteUrl("https://example.github.io/mazing/?old=1", {
              serverUrl: "https://rooms.example.workers.dev",
              roomCode: "ABC234",
            }).includes("/mazing/?lobby=ABC234&server=") &&
            leaderboardApiUrl(
              "https://rooms.example.workers.dev/service/",
              LEADERBOARD_MODES.ONLINE,
            ) === "https://rooms.example.workers.dev/service/leaderboard?mode=online",
          "online lobby invites preserve static-host project paths",
        );
        assert(
          RUN_FLOORS === 5 &&
            JSON.stringify(Array.from({ length: 5 }, (_, index) => floorConfig(index + 1))) ===
              JSON.stringify([
                { floorNumber: 1, width: 20, height: 15, buildDurationMs: 80_000, minStartingGold: 80, maxStartingGold: 250 },
                { floorNumber: 2, width: 22, height: 17, buildDurationMs: 100_000, minStartingGold: 100, maxStartingGold: 270 },
                { floorNumber: 3, width: 24, height: 19, buildDurationMs: 120_000, minStartingGold: 120, maxStartingGold: 290 },
                { floorNumber: 4, width: 26, height: 21, buildDurationMs: 140_000, minStartingGold: 140, maxStartingGold: 310 },
                { floorNumber: 5, width: 28, height: 23, buildDurationMs: 160_000, minStartingGold: 160, maxStartingGold: 330 },
              ]),
          "roguelike floors grow with 20-second timers and 20-gold bounds",
        );
        const fittedBoards = [
          [320, 240],
          [640, 480],
          [1_000, 750],
          [1_280, 720],
        ].flatMap(([viewWidth, viewHeight]) =>
          [1, 1.25, 2].flatMap((pixelRatio) =>
            Array.from({ length: RUN_FLOORS }, (_, index) => {
              const floor = floorConfig(index + 1);
              return fitBoardGeometry(
                viewWidth,
                viewHeight,
                floor.width,
                floor.height,
                pixelRatio,
              );
            }),
          ),
        );
        assert(
          fittedBoards.every(
            (geometry) =>
              geometry.cell > 0 &&
              geometry.left >= 0 &&
              geometry.top >= 0 &&
              geometry.right <= geometry.width &&
              geometry.bottom <= geometry.height,
          ),
          "every floor fits fully inside desktop and mobile canvas bounds",
        );
        const firstAugmentDraft = draftAugmentChoices("BROWSER-RUN", 1);
        const radiantAugmentDraft = draftAugmentChoices("BROWSER-RUN", 3);
        const convertedAugmentMap = applyMapAugments(
          { baseSlowTowers: [{ x: 1, y: 1 }], baseSpeedTowers: [{ x: 3, y: 2 }] },
          [AUGMENT_IDS.CORRUPT_SPEED],
        );
        const radiantBaseMap = generateBaseMap({
          seed: "browser-radiant-augment-map",
          width: 26,
          height: 21,
          mapShape: MAP_SHAPES.RECTANGLE,
          rockDensity: 0.1,
          slowTowerCount: 0,
          speedTowerCount: 0,
          portalCount: 0,
          trapDoorCount: 0,
          endlessFeastCount: 0,
        });
        const gatesMap = applyMapAugments(radiantBaseMap, [AUGMENT_IDS.GATES_OF_HADES]);
        const trapQueenMap = applyMapAugments(radiantBaseMap, [AUGMENT_IDS.TRAP_QUEEN]);
        const crushingColdMap = applyMapAugments(radiantBaseMap, [AUGMENT_IDS.CRUSHING_COLD]);
        const juxtapositionMap = applyMapAugments(radiantBaseMap, [AUGMENT_IDS.JUXTAPOSITION]);
        assert(
          firstAugmentDraft.length === 2 &&
            new Set(firstAugmentDraft).size === 2 &&
            JSON.stringify(firstAugmentDraft) ===
              JSON.stringify(draftAugmentChoices("BROWSER-RUN", 1)) &&
            firstAugmentDraft.every((id) => AUGMENTS[id].tier === AUGMENT_TIERS.GOLD) &&
            !("WIDE_LAMENT" in AUGMENT_IDS) &&
            Object.values(AUGMENTS).filter((augment) => augment.tier === AUGMENT_TIERS.GOLD).length === 3 &&
            radiantAugmentDraft.every((id) => AUGMENTS[id].tier === AUGMENT_TIERS.RADIANT) &&
            augmentTierForDraft(2) === AUGMENT_TIERS.GOLD &&
            augmentTierForDraft(3) === AUGMENT_TIERS.RADIANT &&
            hasAugmentDraftAfterFloor(3) &&
            !hasAugmentDraftAfterFloor(4) &&
            applyResourceAugments({ gold: 90, tears: 1 }, [AUGMENT_IDS.BONUS_GOLD]).gold === 120 &&
            discountedBuildingCost(10, [AUGMENT_IDS.CHEAP_BUILDINGS], "crate") === 9 &&
            discountedBuildingCost(18, [AUGMENT_IDS.CHEAP_BUILDINGS], "fence") === 15 &&
            discountedBuildingCost(26, [AUGMENT_IDS.CHEAP_BUILDINGS], "tower") === 20 &&
            JSON.stringify(mapGenerationBonuses([
              AUGMENT_IDS.GATES_OF_HADES,
              AUGMENT_IDS.TRAP_QUEEN,
              AUGMENT_IDS.CRUSHING_COLD,
              AUGMENT_IDS.JUXTAPOSITION,
            ])) === JSON.stringify({ portalPairs: 1, trapDoors: 3, slowTowers: 6, speedTowers: 4 }) &&
            convertedAugmentMap.baseSpeedTowers.length === 0 &&
            convertedAugmentMap.baseSlowTowers.length === 2 &&
            gatesMap.portalPair.length === 2 &&
            trapQueenMap.baseTrapDoors.length === 3 &&
            crushingColdMap.baseSlowTowers.length === 2 &&
            juxtapositionMap.baseSlowTowers.length === 4 &&
            juxtapositionMap.baseSpeedTowers.length === 4,
          "augment drafts and persistent effects are deterministic",
        );
        const diagonalPath = [{ x: 0, y: 0 }, { x: 1, y: 1 }, { x: 2, y: 2 }];
        const diagonalTower = [{ x: 2, y: 0, id: "browser-diagonal-lament" }];
        const diagonalEffects = calculateRunnerSimulation(diagonalPath, diagonalTower, {
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
          speedTowers: [{ x: 2, y: 0, id: "browser-diagonal-speed" }],
        });
        assert(
          diagonalEffects.slowApplications.length === 1 &&
            diagonalEffects.speedApplications.length === 1 &&
            diagonalEffects.slowApplications[0].pathIndex === 1 &&
            diagonalEffects.speedApplications[0].pathIndex === 1,
          "slow and speed towers affect all eight surrounding tiles",
        );
        const spectatorContestants = [
          { id: "player", isPlayer: true, state: { route: ["player"] } },
          { id: "bramble", state: { route: ["bramble"] } },
        ];
        assert(
          resolveSpectatedContestant(spectatorContestants, "bramble", true).id === "bramble" &&
            resolveSpectatedContestant(spectatorContestants, "bramble", false).id === "player" &&
            resolveSpectatedContestant(spectatorContestants, "missing", true).id === "player",
          "spectator selection switches maze state only during the race",
        );
        assert(
          normalizeRoundCount(null) === 3 &&
            normalizeRoundCount("5") === 5 &&
            normalizeRoundCount(0) === 1 &&
            normalizeRoundCount(99) === 20,
          "contest round selection is normalized to 1 through 20",
        );
        assert(
          normalizeChallengeSeed(" friend-42 ") === "FRIEND-42" &&
            deriveContestRoundSeed("friend-42", 1) === "FRIEND-42" &&
            deriveContestRoundSeed("friend-42", 2) ===
              deriveContestRoundSeed("FRIEND-42", 2) &&
            deriveContestRoundSeed("friend-42", 2) !==
              deriveContestRoundSeed("friend-42", 3) &&
            parseChallengeTarget("12345") === 12_345 &&
            parseChallengeTarget("bad") === null &&
            createChallengeUrl("https://example.com/game/?skipIntro=1#old", {
              contestSeed: "friend-42",
              rounds: 3,
              targetMs: 12_345,
            }) === "https://example.com/game/?challenge=FRIEND-42&rounds=3&target=12345",
          "one challenge link deterministically defines every round and score target",
        );
        const scoreContestants = [
          { id: "player", name: "You", scoreMs: 4_000 },
          { id: "rival", name: "Rival", scoreMs: 5_000 },
        ];
        const emptyTotals = createCumulativeScores(scoreContestants);
        const firstTotals = addRoundScores(emptyTotals, scoreContestants);
        const finalTotals = addRoundScores(firstTotals, [
          { id: "player", scoreMs: 3_000 },
          { id: "rival", scoreMs: 1_000 },
        ]);
        const totalRanking = rankCumulativeScores(scoreContestants, finalTotals);
        assert(
          emptyTotals.player === 0 &&
            finalTotals.player === 7_000 &&
            finalTotals.rival === 6_000 &&
            totalRanking[0].id === "player" &&
            totalRanking[0].rank === 1,
          "contest winner is ranked by cumulative milliseconds across rounds",
        );

        const firstMap = generateBaseMap({ seed: "browser-smoke", width: 15, height: 11 });
        const secondMap = generateBaseMap({ seed: "browser-smoke", width: 15, height: 11 });
        assert(JSON.stringify(firstMap) === JSON.stringify(secondMap), "same seed reproduces the base map");
        assert(findShortestPath(firstMap)?.length > 1, "generated base map has a route");
        const shapedMaps = Object.values(MAP_SHAPES).map((mapShape) =>
          generateBaseMap({
            seed: `browser-${mapShape}`,
            width: 20,
            height: 15,
            mapShape,
            rockDensity: 0,
            slowTowerCount: 0,
            speedTowerCount: 0,
          }),
        );
        assert(
          shapedMaps.every(
            (map) =>
              findShortestPath(map)?.length > 1 &&
              !map.voidCells.some(
                (cell) =>
                  (cell.x === map.start.x && cell.y === map.start.y) ||
                  (cell.x === map.goal.x && cell.y === map.goal.y),
              ),
          ) &&
            shapedMaps.find((map) => map.mapShape === "rectangle").voidCells.length === 0 &&
            shapedMaps
              .filter((map) => map.mapShape !== "rectangle")
              .every((map) => map.voidCells.length > 0),
          "rectangle, diamond, donut, and flower silhouettes are playable",
        );
        const browserFlower = shapedMaps.find((map) => map.mapShape === "flower");
        assert(
          20 * 15 - browserFlower.voidCells.length === 128,
          "flower petals use the slightly wider silhouette",
        );
        const browserDonut = shapedMaps.find((map) => map.mapShape === "donut");
        const donutState = createGameState({ baseMap: browserDonut, startingGold: 100 });
        const donutVoid = browserDonut.voidCells[0];
        const voidPlacement = evaluateObstacleGroupPlacement(donutState, {
          type: "crate",
          cost: 10,
          cells: [donutVoid],
        });
        assert(
          createCellGrid(donutState)[donutVoid.y][donutVoid.x] === CELL_TYPES.VOID &&
            !voidPlacement.ok &&
            voidPlacement.reason === "outside-map" &&
            donutState.gold === 100,
          "void silhouette cells are unwalkable and unbuildable",
        );
        const feastMap = generateBaseMap({
          seed: "browser-endless-feast",
          width: 20,
          height: 15,
          mapShape: "diamond",
          rockDensity: 0.15,
          slowTowerCount: 1,
          speedTowerCount: 1,
          endlessFeastCount: 1,
        });
        const feastState = createGameState({ baseMap: feastMap, startingGold: 100 });
        const feastIndex = feastState.route.findIndex(
          (cell) =>
            cell.x === feastMap.endlessFeast.x &&
            cell.y === feastMap.endlessFeast.y,
        );
        const feastPlacement = evaluateObstacleGroupPlacement(feastState, {
          type: "crate",
          cost: 10,
          cells: [feastMap.endlessFeast],
        });
        const feastArrival = feastState.runnerSimulation.segments.find(
          (segment) => segment.type === "move" && segment.toIndex === feastIndex,
        );
        assert(
          feastIndex > 0 &&
            feastIndex < feastState.route.length - 1 &&
            createCellGrid(feastState)[feastMap.endlessFeast.y][feastMap.endlessFeast.x] ===
              CELL_TYPES.ENDLESS_FEAST &&
            !feastPlacement.ok &&
            feastPlacement.reason === "protected-cell" &&
            getRunnerPositionAtTime(feastState.runnerSimulation, 0).insatiablyHungry === true &&
            getRunnerPositionAtTime(
              feastState.runnerSimulation,
              feastArrival.endMs,
            ).insatiablyHungry === false &&
            feastState.gold === 100,
          "Endless Feast is a protected mandatory checkpoint",
        );
        const feastObjects = [
          ...feastMap.baseRocks,
          ...feastMap.baseSlowTowers,
          ...feastMap.baseSpeedTowers,
        ];
        assert(
          feastObjects.every(
            (object) =>
              Math.abs(object.x - feastMap.endlessFeast.x) +
                Math.abs(object.y - feastMap.endlessFeast.y) >
              1,
          ),
          "Endless Feast keeps an open cardinal clearing",
        );
        const openSideState = createGameState({
          baseMap: {
            width: 7,
            height: 7,
            seed: "browser-feast-open-side",
            start: { x: 0, y: 3 },
            goal: { x: 6, y: 3 },
            endlessFeast: { x: 3, y: 3 },
            baseRocks: [],
          },
          startingGold: 100,
        });
        const feastSides = [
          { x: 3, y: 2 },
          { x: 4, y: 3 },
          { x: 3, y: 4 },
          { x: 2, y: 3 },
        ];
        const threeBlockedSides = tryPlaceObstacleGroup(openSideState, {
          id: "browser-three-feast-sides",
          type: "test-wall",
          cost: 10,
          cells: feastSides.slice(0, 3),
        });
        assert(
          threeBlockedSides.ok &&
            threeBlockedSides.state.gold === 90 &&
            threeBlockedSides.state.route.some(
              (cell) => cell.x === 3 && cell.y === 3,
            ),
          "Endless Feast permits builds on three sides",
        );
        const lastSideBlocked = evaluateObstacleGroupPlacement(
          threeBlockedSides.state,
          {
            id: "browser-last-feast-side",
            type: "test-wall",
            cost: 10,
            cells: [feastSides[3]],
          },
        );
        assert(
          !lastSideBlocked.ok &&
            lastSideBlocked.reason === "blocks-path" &&
            lastSideBlocked.state.gold === 90,
          "Endless Feast rejects blocking its final open side",
        );
        assert(
          firstMap.endlessFeastSpawnChance === 0.2,
          "Endless Feast uses the default independent 20% round chance",
        );

        const openDiagonalPath = findShortestPath({
          width: 3,
          height: 3,
          start: { x: 0, y: 0 },
          goal: { x: 2, y: 2 },
          blocked: [],
        });
        const diagonalMetrics = calculateRouteMetrics(openDiagonalPath, {
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        assert(
          openDiagonalPath.length === 3 &&
            approximately(diagonalMetrics.distance, 2 * Math.SQRT2) &&
            diagonalMetrics.travelTimeMs === Math.round(2_000 * Math.SQRT2),
          "open fields use the shorter weighted diagonal route",
        );

        const oneCornerSideBlocked = findShortestPath({
          width: 2,
          height: 2,
          start: { x: 0, y: 0 },
          goal: { x: 1, y: 1 },
          blocked: [{ x: 1, y: 0 }],
        });
        const bothCornerSidesBlocked = findShortestPath({
          width: 2,
          height: 2,
          start: { x: 0, y: 0 },
          goal: { x: 1, y: 1 },
          blocked: [{ x: 1, y: 0 }, { x: 0, y: 1 }],
        });
        assert(
          oneCornerSideBlocked.length === 2 && bothCornerSidesBlocked === null,
          "diagonals round one object but cannot squeeze between two objects",
        );

        const resources = generateRoundResources("browser-smoke");
        assert(
          JSON.stringify(resources) === JSON.stringify(generateRoundResources("browser-smoke")) &&
            resources.gold >= 80 && resources.gold <= 250 &&
            resources.tears >= 0 && resources.tears <= 2,
          "round gold and Tears are deterministic bounded integers",
        );
        const towerMap = generateBaseMap({
          seed: "forced-neutral-towers",
          width: 15,
          height: 11,
          rockDensity: 0.1,
          slowTowerCount: 2,
          speedTowerCount: 1,
        });
        const towerState = createGameState({ baseMap: towerMap });
        const speedTower = towerMap.baseSpeedTowers[0];
        assert(
          towerMap.baseSlowTowers.length === 2 &&
            towerMap.baseSpeedTowers.length === 1 &&
            findShortestPath(towerMap) &&
            createCellGrid(towerState)[speedTower.y][speedTower.x] === CELL_TYPES.SPEED_TOWER,
          "forced neutral slow and speed towers are distinct blockers that preserve a route",
        );
        const guaranteedSpeedMap = generateBaseMap({
          seed: "guaranteed-speed",
          width: 7,
          height: 5,
          rockDensity: 0,
          slowTowerCount: 0,
          speedTowerSpawnChance: 1,
        });
        const noSpeedMap = generateBaseMap({
          seed: "no-speed",
          width: 7,
          height: 5,
          rockDensity: 0,
          slowTowerCount: 0,
          speedTowerSpawnChance: 0,
        });
        assert(
          firstMap.speedTowerSpawnChance === null &&
            JSON.stringify(firstMap.speedTowerSpawnChances) === JSON.stringify([0.58, 0.36, 0.06]) &&
            JSON.stringify(firstMap.speedTowerSpawnChances) === JSON.stringify(firstMap.slowTowerSpawnChances) &&
            guaranteedSpeedMap.baseSpeedTowers.length === 1 &&
            noSpeedMap.baseSpeedTowers.length === 0,
          "neutral speed towers use the slow-tower count rates while retaining explicit legacy rolls",
        );
        const visualSpeedMap = Array.from({ length: 32 }, (_, index) =>
          generateBaseMap({
            seed: `VISUAL-SPEED-${index}`,
            width: 15,
            height: 11,
            rockDensity: 0.115,
          }),
        ).find((map) => map.baseSpeedTowers.length === 1);
        assert(visualSpeedMap, "the default roll produces a reproducible speed-tower round");
        document.body.dataset.speedTowerSeed = visualSpeedMap.seed;

        const linkedPortalState = createGameState({
          baseMap: {
            width: 7,
            height: 1,
            seed: "browser-linked-portal",
            start: { x: 0, y: 0 },
            goal: { x: 6, y: 0 },
            baseRocks: [],
            portalPair: [{ x: 1, y: 0 }, { x: 5, y: 0 }],
          },
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        const portalPlacement = evaluateObstacleGroupPlacement(linkedPortalState, {
          type: "crate",
          cost: 10,
          cells: [{ x: 1, y: 0 }],
        });
        assert(
          JSON.stringify(findShortestPath({
            width: 7,
            height: 1,
            start: { x: 0, y: 0 },
            goal: { x: 6, y: 0 },
            blocked: [],
            portalPair: [{ x: 1, y: 0 }, { x: 5, y: 0 }],
          })) === JSON.stringify(Array.from({ length: 7 }, (_, x) => ({ x, y: 0 }))) &&
          JSON.stringify(linkedPortalState.route) === JSON.stringify([
            { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 5, y: 0 }, { x: 6, y: 0 },
          ]) &&
            linkedPortalState.scoreMs === 2_000 &&
            linkedPortalState.runnerSimulation.portalApplications.length === 1 &&
            createCellGrid(linkedPortalState)[0][1] === CELL_TYPES.PORTAL &&
            !portalPlacement.ok &&
            portalPlacement.reason === "protected-cell",
          "a linked portal teleports once and deactivates in the runner timeline",
        );
        const twoPairMap = generateBaseMap({
          seed: "browser-two-portal-pairs",
          width: 20,
          height: 12,
          rockDensity: 0.1,
          slowTowerCount: 0,
          speedTowerCount: 0,
          trapDoorCount: 0,
          portalCount: 2,
        });
        const portalsAreSeparated = twoPairMap.portalPair.every((portal, index, portals) =>
          portals.slice(0, index).every((other) =>
            Math.max(Math.abs(portal.x - other.x), Math.abs(portal.y - other.y)) >=
              MIN_PORTAL_SEPARATION,
          ),
        );
        const twoPairState = createGameState({
          baseMap: {
            width: 17,
            height: 1,
            seed: "browser-two-portal-corridor",
            start: { x: 0, y: 0 },
            goal: { x: 16, y: 0 },
            baseRocks: [],
            portalPair: [
              { x: 1, y: 0 }, { x: 5, y: 0 },
              { x: 9, y: 0 }, { x: 13, y: 0 },
            ],
          },
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        assert(
          twoPairMap.portalPair.length === 4 &&
            portalsAreSeparated &&
            twoPairState.runnerSimulation.portalApplications.length === 2 &&
            twoPairState.scoreMs === 8_000,
          "multiple portal pairs stay three squares apart and deactivate independently",
        );
        const trapDoorState = createGameState({
          baseMap: {
            width: 8,
            height: 1,
            seed: "browser-trap-door",
            start: { x: 0, y: 0 },
            goal: { x: 7, y: 0 },
            baseRocks: [],
            baseTrapDoors: [{ x: 1, y: 0 }],
          },
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        assert(
          JSON.stringify(trapDoorState.route.slice(0, 3)) === JSON.stringify([
            { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 4, y: 0 },
          ]) &&
            trapDoorState.scoreMs === 5_000 &&
            trapDoorState.runnerSimulation.trapDoorApplications.length === 1 &&
            createCellGrid(trapDoorState)[0][1] === CELL_TYPES.TRAP_DOOR,
          "a trap door launches three squares in one step and deactivates",
        );
        const edgeTrapState = createGameState({
          baseMap: {
            width: 5,
            height: 1,
            seed: "browser-edge-trap",
            start: { x: 0, y: 0 },
            goal: { x: 4, y: 0 },
            baseRocks: [],
            baseTrapDoors: [{ x: 3, y: 0 }],
          },
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        assert(
          edgeTrapState.runnerSimulation.trapDoorApplications[0]?.landing.x === 4 &&
            edgeTrapState.runnerSimulation.trapDoorApplications[0]?.landing.y === 0 &&
            edgeTrapState.scoreMs === 4_000,
          "a trap door clamps its landing to the last valid edge square",
        );
        const ignoredShortcutState = createGameState({
          baseMap: {
            width: 7,
            height: 3,
            seed: "browser-ignore-shortcuts",
            start: { x: 0, y: 1 },
            goal: { x: 6, y: 1 },
            baseRocks: [],
            portalPair: [{ x: 1, y: 0 }, { x: 4, y: 0 }],
            baseTrapDoors: [{ x: 2, y: 2 }],
          },
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
        });
        assert(
          JSON.stringify(ignoredShortcutState.route) ===
              JSON.stringify(Array.from({ length: 7 }, (_, x) => ({ x, y: 1 }))) &&
            ignoredShortcutState.runnerSimulation.portalApplications.length === 0 &&
            ignoredShortcutState.runnerSimulation.trapDoorApplications.length === 0 &&
            ignoredShortcutState.scoreMs === 6_000,
          "portals and trap doors never attract the runner away from its direct route",
        );

        const corridor = {
          width: 5,
          height: 1,
          seed: "corridor",
          start: { x: 0, y: 0 },
          goal: { x: 4, y: 0 },
          baseRocks: [],
        };
        const corridorState = createGameState({ baseMap: corridor, startingGold: 20, refundRate: 1 });
        const blocked = evaluateObstacleGroupPlacement(corridorState, {
          id: "seal",
          type: "crate",
          cost: 10,
          cells: [{ x: 2, y: 0 }],
        });
        assert(!blocked.ok && blocked.reason === "blocks-path", "route-sealing placement is rejected");
        assert(corridorState.gold === 20 && corridorState.obstacles.length === 0, "rejected placement is atomic and free");

        const generatedObjectState = createGameState({
          baseMap: {
            width: 5,
            height: 3,
            seed: "browser-demolition",
            start: { x: 0, y: 1 },
            goal: { x: 4, y: 1 },
            baseRocks: [{ x: 2, y: 1 }],
          },
          startingGold: 8,
        });
        const demolished = tryRemoveGeneratedObject(generatedObjectState, { x: 2, y: 1 });
        assert(
          demolished.ok &&
            demolished.cost === 8 &&
            demolished.state.gold === 0 &&
            demolished.state.baseRocks.length === 0 &&
            generatedObjectState.baseRocks.length === 1,
          "generated objects can be removed immutably for 8 gold",
        );
        const fixedSpeedTowerState = createGameState({
          baseMap: {
            width: 5,
            height: 3,
            seed: "browser-fixed-speed",
            start: { x: 0, y: 1 },
            goal: { x: 4, y: 1 },
            baseRocks: [],
            baseSpeedTowers: [{ x: 2, y: 0 }],
          },
          startingGold: 8,
        });
        const fixedSpeedRemoval = tryRemoveGeneratedObject(
          fixedSpeedTowerState,
          { x: 2, y: 0 },
        );
        assert(
          !fixedSpeedRemoval.ok &&
            fixedSpeedRemoval.reason === "no-generated-object" &&
            fixedSpeedRemoval.state.gold === 8 &&
            fixedSpeedRemoval.state.baseSpeedTowers.length === 1,
          "neutral speed towers cannot be removed",
        );

        const openBoard = {
          width: 5,
          height: 3,
          seed: "groups",
          start: { x: 0, y: 1 },
          goal: { x: 4, y: 1 },
          baseRocks: [],
        };
        const groupState = createGameState({ baseMap: openBoard, startingGold: 20, refundRate: 1 });
        const placed = tryPlaceObstacleGroup(groupState, {
          id: "fence-a",
          type: "fence",
          cost: 18,
          cells: [{ x: 2, y: 0 }, { x: 3, y: 0 }],
        });
        assert(placed.ok && placed.state.gold === 2 && placed.state.obstacles.length === 2, "multi-cell group charges once");
        assert(groupState.gold === 20 && groupState.obstacles.length === 0, "placement does not mutate its input state");
        const removed = tryRemoveObstacleGroup(placed.state, "fence-a", { refundRate: 1 });
        assert(removed.ok && removed.state.gold === 20 && removed.state.obstacles.length === 0, "group removal refunds once and removes every cell");
        const cappedRefund = tryRemoveObstacleGroup(placed.state, "fence-a", { refundAmount: 999 });
        assert(cappedRefund.ok && cappedRefund.refund === 18 && cappedRefund.state.gold === 20, "refund cannot exceed purchase price");

        const tearState = createGameState({
          baseMap: openBoard,
          startingGold: 80,
          startingTears: 1,
          stepDurationMs: 280,
          turnPenaltyMs: 0,
        });
        const slowPlaced = tryPlaceObstacleGroup(tearState, {
          id: "slow-a",
          type: "slow-tower",
          cost: 0,
          tearCost: 1,
          cells: [{ x: 2, y: 0 }],
        });
        assert(
          slowPlaced.ok && slowPlaced.state.tears === 0 && slowPlaced.state.scoreMs > tearState.scoreMs,
          "a Tear atomically builds a score-affecting slow tower",
        );
        const slowRemoved = tryRemoveObstacleGroup(slowPlaced.state, "slow-a", { refundRate: 1 });
        assert(
          slowRemoved.ok && slowRemoved.tearRefund === 1 && slowRemoved.state.tears === 1,
          "removing a slow tower refunds its Tear exactly once",
        );

        const slowSimulation = calculateRunnerSimulation(
          [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 3, y: 0 }],
          [{ x: 0, y: 1, id: "start-slow" }],
          { stepDurationMs: 280, turnPenaltyMs: 0, slowDurationMs: 5000, slowTowerCooldownMs: 5000 },
        );
        assert(
          slowSimulation.travelTimeMs === 1680 && slowSimulation.slowApplications.length === 1,
          "an eight-tile slow tower halves speed without frame-rate timing",
        );
        assert(getRunnerPositionAtTime(slowSimulation, 500).slowed, "runner timeline exposes the active debuff for rendering");

        const longPath = Array.from({ length: 13 }, (_, x) => ({ x, y: 0 }));
        const speedSimulation = calculateRunnerSimulation(longPath, [], {
          stepDurationMs: 1_000,
          turnPenaltyMs: 0,
          speedDurationMs: 5_000,
          speedSpeedMultiplier: 2,
          speedTowers: [{ x: -1, y: 0, id: "start-speed" }],
        });
        assert(
          speedSimulation.travelTimeMs === 7_000 &&
            speedSimulation.speedApplications.length === 1 &&
            getRunnerPositionAtTime(speedSimulation, 2_500).spedUp,
          "a speed tower grants an exact five-second 2x movement boost",
        );

        const diagonalOnlySpeed = calculateRunnerSimulation(
          [{ x: 0, y: 0 }, { x: 1, y: 1 }, { x: 2, y: 2 }],
          [],
          {
            stepDurationMs: 1_000,
            turnPenaltyMs: 0,
            speedTowers: [{ x: 2, y: 0, id: "diagonal-neighbor" }],
          },
        );
        assert(
          diagonalOnlySpeed.speedApplications.length === 1 &&
            diagonalOnlySpeed.speedApplications[0].pathIndex === 1 &&
            diagonalOnlySpeed.travelTimeMs === Math.round(Math.SQRT2 * 1_000 * (1 + 1 / 1.5)),
          "speed towers trigger diagonally across all eight surrounding tiles",
        );

        const balancedSimulation = calculateRunnerSimulation(
          [{ x: 0, y: 1 }, { x: 1, y: 1 }, { x: 2, y: 1 }],
          [{ x: -1, y: 1, id: "balance-slow" }],
          {
            stepDurationMs: 1_000,
            turnPenaltyMs: 0,
            speedTowers: [{ x: -1, y: 1, id: "balance-speed" }],
          },
        );
        const balancedPosition = getRunnerPositionAtTime(balancedSimulation, 500);
        assert(
          balancedSimulation.travelTimeMs === 2_667 &&
            balancedPosition.slowed &&
            balancedPosition.spedUp &&
            balancedPosition.speedMultiplier === 0.75,
          "simultaneous 0.5x slow and 1.5x speed effects multiply and remain visible",
        );

        const goalOnlySpeed = calculateRunnerSimulation(
          [{ x: 0, y: 0 }, { x: 1, y: 0 }],
          [],
          {
            stepDurationMs: 1_000,
            turnPenaltyMs: 0,
            speedTowers: [{ x: 2, y: 1, id: "goal-only" }],
          },
        );
        assert(
          goalOnlySpeed.speedApplications.length === 0 && goalOnlySpeed.travelTimeMs === 1_000,
          "entering the goal does not create a post-finish speed trigger",
        );

        const aiInitial = createGameState({ baseMap: firstMap, startingGold: 30, obstacleCost: 10 });
        const firstAi = buildRivalMaze(aiInitial, { seed: "same-ai", maxPlacements: 3 });
        const secondAi = buildRivalMaze(aiInitial, { seed: "same-ai", maxPlacements: 3 });
        assert(JSON.stringify(firstAi) === JSON.stringify(secondAi), "rival commands are deterministic");
        assert(firstAi.state.route && firstAi.state.gold >= 0, "rival preserves a legal route and budget");

        const appFrame = document.createElement("iframe");
        Object.assign(appFrame.style, {
          position: "fixed",
          left: "-2000px",
          top: "0",
          width: "1440px",
          height: "1000px",
          border: "0",
        });
        appFrame.src = "/?challenge=SPECTATORCLICK&rounds=5&target=12345&skipIntro=1";
        document.body.append(appFrame);
        try {
          await new Promise((resolve, reject) => {
            const timeout = window.setTimeout(
              () => reject(new Error("Spectator click test app did not load.")),
              10_000,
            );
            appFrame.addEventListener("load", () => {
              window.clearTimeout(timeout);
              resolve();
            }, { once: true });
          });
          const appDocument = appFrame.contentDocument;
          const appWindow = appFrame.contentWindow;
          assert(
            appDocument.body.dataset.contestSeed === "SPECTATORCLICK" &&
              appDocument.body.dataset.sharedChallenge === "true" &&
              appDocument.querySelector("#roundCountInput")?.disabled === true &&
              appDocument.querySelector("#challengeTarget")?.textContent.includes("12.3s") &&
              appDocument.body.dataset.contestRounds === "5" &&
              appDocument.body.dataset.floorWidth === "20" &&
              appDocument.body.dataset.floorHeight === "15" &&
              appDocument.body.dataset.buildDurationMs === "80000" &&
              appDocument.body.dataset.minStartingGold === "80" &&
              appDocument.body.dataset.maxStartingGold === "250",
            "shared challenge links lock the contest and display the score to beat",
          );
          assert(
            appDocument.querySelector("#openOnlineButton")?.textContent === "Play online" &&
              appDocument.querySelector("#lobbyModal") &&
              appDocument.querySelector("#leaderboardModal") &&
              appDocument.querySelector("#playerNameInput") &&
              !(appDocument.body.dataset.appError ?? ""),
            "online lobby and global leaderboard controls load without changing solo challenge mode",
          );
          const rivalAiStats = JSON.parse(appDocument.body.dataset.rivalAiStats ?? "[]");
          const vesperStats = rivalAiStats.find((entry) => entry.id === "vesper");
          assert(
            vesperStats?.strategy === "lookahead" &&
              vesperStats.maxEvaluations === 20_000 &&
              vesperStats.evaluations > 0 &&
              vesperStats.evaluations <= vesperStats.maxEvaluations,
            `Vesper uses deterministic lookahead within a hard preview budget (${vesperStats?.evaluations ?? 0}/${vesperStats?.maxEvaluations ?? 0})`,
          );
          appDocument.querySelector("#runButton").click();
          await new Promise((resolve) => window.setTimeout(resolve, 2_100));
          const cinderRow = appDocument.querySelector("[data-spectate-id='cinder']");
          const cinderName = cinderRow?.querySelector("strong");
          cinderName?.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
          await new Promise((resolve) => window.setTimeout(resolve, 350));
          const rowStayedMounted =
            cinderRow === appDocument.querySelector("[data-spectate-id='cinder']") &&
            cinderName === cinderRow?.querySelector("strong");
          cinderName?.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
          cinderName?.click();
          await new Promise((resolve) => window.setTimeout(resolve, 0));
          const clickSnapshot = {
            rowStayedMounted,
            phase: appDocument.body.dataset.phase,
            spectating: appDocument.body.dataset.spectating,
            heading: appDocument.querySelector("#mazeOwnerHeading")?.textContent,
            rowCount: appDocument.querySelectorAll("[data-spectate-id]").length,
            appError: appDocument.body.dataset.appError ?? null,
          };
          const spectatorClickWorked =
            rowStayedMounted &&
              clickSnapshot.spectating === "cinder" &&
              clickSnapshot.heading === "Cinder Vale's maze" &&
              !clickSnapshot.appError;
          if (!spectatorClickWorked) {
            throw new Error(
              `Spectator click regression: ${JSON.stringify(clickSnapshot)}`,
            );
          }
          assert(
            spectatorClickWorked,
            "contestant names remain stable and clickable across race ticks",
          );

          let acceleratedNow = appWindow.performance.now();
          appWindow.requestAnimationFrame = (callback) =>
            appWindow.setTimeout(() => callback((acceleratedNow += 10_000)), 0);
          const waitForAppPhase = (expectedPhase) => new Promise((resolve) => {
            const timeoutAt = window.performance.now() + 5_000;
            const checkPhase = () => {
              if (appDocument.body.dataset.phase === expectedPhase) {
                resolve(true);
              } else if (window.performance.now() >= timeoutAt) {
                resolve(false);
              } else {
                window.setTimeout(checkPhase, 25);
              }
            };
            checkPhase();
          });
          const resultsReached = await waitForAppPhase("results");
          appDocument.querySelector("#nextRoundButton")?.click();
          const draftButtons = [
            ...appDocument.querySelectorAll("#augmentChoices [data-augment]"),
          ];
          const draftOpened =
            appDocument.body.dataset.phase === "augment" &&
            appDocument.body.dataset.augmentTier === AUGMENT_TIERS.GOLD &&
            appDocument.querySelector("#augmentModal")?.classList.contains("open") &&
            draftButtons.length === 2 &&
            new Set(draftButtons.map((button) => button.dataset.augment)).size === 2 &&
            draftButtons.every(
              (button) => AUGMENTS[button.dataset.augment].tier === AUGMENT_TIERS.GOLD,
            );
          const chosenAugment = draftButtons[0]?.dataset.augment;
          draftButtons[0]?.click();
          const nextFloorSnapshot = {
            resultsReached,
            draftOpened,
            phase: appDocument.body.dataset.phase,
            floor: appDocument.body.dataset.floor,
            floorWidth: appDocument.body.dataset.floorWidth,
            floorHeight: appDocument.body.dataset.floorHeight,
            buildDurationMs: appDocument.body.dataset.buildDurationMs,
            minStartingGold: appDocument.body.dataset.minStartingGold,
            maxStartingGold: appDocument.body.dataset.maxStartingGold,
            chosenAugment,
            augments: JSON.parse(appDocument.body.dataset.augments ?? "[]"),
            augmentValue: appDocument.querySelector("#augmentValue")?.textContent,
            boardFits: appDocument.querySelector("#gameCanvas")?.dataset.boardFits,
            appError: appDocument.body.dataset.appError ?? null,
          };
          const nextFloorWorked =
            draftOpened &&
              nextFloorSnapshot.phase === "build" &&
              nextFloorSnapshot.floor === "2" &&
              nextFloorSnapshot.floorWidth === "22" &&
              nextFloorSnapshot.floorHeight === "17" &&
              nextFloorSnapshot.buildDurationMs === "100000" &&
              nextFloorSnapshot.minStartingGold === "100" &&
              nextFloorSnapshot.maxStartingGold === "270" &&
              nextFloorSnapshot.augments.includes(chosenAugment) &&
              nextFloorSnapshot.augmentValue === "1" &&
              nextFloorSnapshot.boardFits === "true" &&
              !nextFloorSnapshot.appError;
          if (!nextFloorWorked) {
            throw new Error(
              `Next-floor regression: ${JSON.stringify(nextFloorSnapshot)}`,
            );
          }
          assert(
            nextFloorWorked,
            "clearing a floor opens a two-card augment draft and starts the larger next floor",
          );

          appDocument.querySelector("#runButton")?.click();
          const secondResultsReached = await waitForAppPhase("results");
          appDocument.querySelector("#nextRoundButton")?.click();
          const secondGoldDraft = [
            ...appDocument.querySelectorAll("#augmentChoices [data-augment]"),
          ];
          const secondGoldDraftWorked =
            secondResultsReached &&
            appDocument.body.dataset.augmentTier === AUGMENT_TIERS.GOLD &&
            secondGoldDraft.length === 2 &&
            secondGoldDraft.every(
              (button) => AUGMENTS[button.dataset.augment].tier === AUGMENT_TIERS.GOLD,
            );
          secondGoldDraft[0]?.click();

          appDocument.querySelector("#runButton")?.click();
          const thirdResultsReached = await waitForAppPhase("results");
          appDocument.querySelector("#nextRoundButton")?.click();
          const radiantDraft = [
            ...appDocument.querySelectorAll("#augmentChoices [data-augment]"),
          ];
          const radiantDraftWorked =
            thirdResultsReached &&
            appDocument.body.dataset.augmentTier === AUGMENT_TIERS.RADIANT &&
            appDocument.querySelector("#augmentTitle")?.textContent ===
              "Choose a radiant augment." &&
            radiantDraft.length === 2 &&
            radiantDraft.every(
              (button) => AUGMENTS[button.dataset.augment].tier === AUGMENT_TIERS.RADIANT,
            );

          const selectedGoldAugments = JSON.parse(
            appDocument.body.dataset.augments ?? "[]",
          );
          const chosenRadiant = radiantDraft[0]?.dataset.augment;
          const selectedForFloorFour = [...selectedGoldAugments, chosenRadiant];
          const floorFourBonuses = mapGenerationBonuses(selectedForFloorFour);
          const floorFourBase = generateBaseMap({
            seed: deriveContestRoundSeed("SPECTATORCLICK", 4),
            width: 26,
            height: 21,
            rockDensity: 0.115,
          });
          let expectedSlowTowers =
            floorFourBase.baseSlowTowers.length + floorFourBonuses.slowTowers;
          let expectedSpeedTowers =
            floorFourBase.baseSpeedTowers.length + floorFourBonuses.speedTowers;
          if (selectedForFloorFour.includes(AUGMENT_IDS.CORRUPT_SPEED)) {
            expectedSlowTowers += expectedSpeedTowers;
            expectedSpeedTowers = 0;
          }
          radiantDraft[0]?.click();
          const radiantEffectWorked =
            appDocument.body.dataset.floor === "4" &&
            Number(appDocument.body.dataset.neutralSlowTowers) === expectedSlowTowers &&
            Number(appDocument.body.dataset.neutralSpeedTowers) === expectedSpeedTowers &&
            Number(appDocument.body.dataset.portalPairs) ===
              floorFourBase.portalPair.length / 2 + floorFourBonuses.portalPairs &&
            Number(appDocument.body.dataset.trapDoors) ===
              floorFourBase.baseTrapDoors.length + floorFourBonuses.trapDoors &&
            !(appDocument.body.dataset.appError ?? "");
          assert(
            secondGoldDraftWorked && radiantDraftWorked && radiantEffectWorked,
            "gold drafts precede a radiant draft whose spawn effect applies on floor four",
          );

          const floorFourInitialSnapshot = {
            contestSeed: appDocument.body.dataset.contestSeed,
            floor: appDocument.body.dataset.floor,
            seed: appDocument.querySelector("#seedValue")?.textContent,
            completedRounds: appDocument.body.dataset.completedRounds,
            cumulativeScores: appDocument.body.dataset.cumulativeScores,
            augments: appDocument.body.dataset.augments,
            gold: appDocument.querySelector("#goldValue")?.textContent,
            tears: appDocument.querySelector("#tearValue")?.textContent,
            neutralSlowTowers: appDocument.body.dataset.neutralSlowTowers,
            neutralSpeedTowers: appDocument.body.dataset.neutralSpeedTowers,
            portalPairs: appDocument.body.dataset.portalPairs,
            trapDoors: appDocument.body.dataset.trapDoors,
          };
          appDocument.querySelector("#runButton")?.click();
          const floorFourResultsReached = await waitForAppPhase("results");
          const firstFloorFourTotals = appDocument.body.dataset.cumulativeScores;
          appDocument.querySelector("#replayRoundButton")?.click();
          const floorFourReplaySnapshot = {
            contestSeed: appDocument.body.dataset.contestSeed,
            floor: appDocument.body.dataset.floor,
            seed: appDocument.querySelector("#seedValue")?.textContent,
            completedRounds: appDocument.body.dataset.completedRounds,
            cumulativeScores: appDocument.body.dataset.cumulativeScores,
            augments: appDocument.body.dataset.augments,
            gold: appDocument.querySelector("#goldValue")?.textContent,
            tears: appDocument.querySelector("#tearValue")?.textContent,
            neutralSlowTowers: appDocument.body.dataset.neutralSlowTowers,
            neutralSpeedTowers: appDocument.body.dataset.neutralSpeedTowers,
            portalPairs: appDocument.body.dataset.portalPairs,
            trapDoors: appDocument.body.dataset.trapDoors,
          };
          const floorFourReplayWorked =
            floorFourResultsReached &&
            appDocument.body.dataset.phase === "build" &&
            JSON.stringify(floorFourReplaySnapshot) ===
              JSON.stringify(floorFourInitialSnapshot) &&
            firstFloorFourTotals !== floorFourInitialSnapshot.cumulativeScores &&
            !(appDocument.body.dataset.appError ?? "");
          assert(
            floorFourReplayWorked,
            "replaying floor four restores its seed, resources, augments, and pre-floor score",
          );

          appDocument.querySelector("#runButton")?.click();
          const replayResultsReached = await waitForAppPhase("results");
          const replayedFloorFourTotals = appDocument.body.dataset.cumulativeScores;
          const floorFiveButtonLabel = appDocument.querySelector("#nextRoundButton")?.textContent;
          appDocument.querySelector("#nextRoundButton")?.click();
          const floorFiveSnapshot = {
            phase: appDocument.body.dataset.phase,
            floor: appDocument.body.dataset.floor,
            floorWidth: appDocument.body.dataset.floorWidth,
            floorHeight: appDocument.body.dataset.floorHeight,
            buildDurationMs: appDocument.body.dataset.buildDurationMs,
            minStartingGold: appDocument.body.dataset.minStartingGold,
            maxStartingGold: appDocument.body.dataset.maxStartingGold,
            completedRounds: appDocument.body.dataset.completedRounds,
            augments: appDocument.body.dataset.augments,
            augmentModalOpen: appDocument.querySelector("#augmentModal")?.classList.contains("open"),
            appError: appDocument.body.dataset.appError ?? null,
          };
          const floorFiveWorked =
            replayResultsReached &&
            replayedFloorFourTotals === firstFloorFourTotals &&
            floorFiveButtonLabel === "Continue to floor 5" &&
            floorFiveSnapshot.phase === "build" &&
            floorFiveSnapshot.floor === "5" &&
            floorFiveSnapshot.floorWidth === "28" &&
            floorFiveSnapshot.floorHeight === "23" &&
            floorFiveSnapshot.buildDurationMs === "160000" &&
            floorFiveSnapshot.minStartingGold === "160" &&
            floorFiveSnapshot.maxStartingGold === "330" &&
            floorFiveSnapshot.completedRounds === "4" &&
            floorFiveSnapshot.augments === floorFourInitialSnapshot.augments &&
            floorFiveSnapshot.augmentModalOpen === false &&
            !floorFiveSnapshot.appError;
          if (!floorFiveWorked) {
            throw new Error(
              `Floor-five progression regression: ${JSON.stringify({
                floorFiveButtonLabel,
                firstFloorFourTotals,
                replayedFloorFourTotals,
                floorFiveSnapshot,
              })}`,
            );
          }
          assert(
            floorFiveWorked,
            "floor four advances directly to a fifth floor without another augment draft",
          );
        } finally {
          appFrame.remove();
        }

        document.body.dataset.status = "passed";
        result.textContent = `PASS (${checks.length} checks)\n${checks.map((check) => `✓ ${check}`).join("\n")}`;
      } catch (error) {
        document.body.dataset.status = "failed";
        result.textContent = `FAIL\n${error.stack || error.message}`;
      } finally {
        document.querySelector('script[type="module"]')?.remove();
      }
    </script>
  </body>
</html>
